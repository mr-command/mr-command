name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=092328&title_color=8BBB92&text_color=8BBB92&icon_color=8BBB92
          path: profile/stats.svg

      - name: Generate Top Languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-languages
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=092328&title_color=8BBB92&text_color=8BBB92&icon_color=8BBB92
          path: profile/top-languages.svg

      - name: Commit Stats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add profile/*.svg
          git commit -m "chore: update github stats" || exit 0
          git push
